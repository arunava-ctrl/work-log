}
function snapshot(id){return JSON.parse(JSON.stringify(S.entries[id]||{}))}
function restore(id,snap){S.entries[id]=snap;save();refreshCard(id)}
let statsT;function refreshStatsSoon(){clearTimeout(statsT);statsT=setTimeout(()=>{if(U.tab!=="log")return;const y=scrollY,f=document.activeElement&&document.activeElement.id;render();scrollTo(0,y);if(f){const el=document.getElementById(f);if(el){el.focus({preventScroll:true});if(el.setSelectionRange){const l=el.value.length;el.setSelectionRange(l,l)}}}},1200)}

function csv(){
  const rows=[["Date","Day","Status","Project","Hours","Tasks","Notes","Pictures"]];
  Object.keys(S.entries).sort(cmpId).forEach(id=>{const [y,m,d]=parseId(id),x=day(y,m,d);if(!x.has&&!x.tag)return;
    rows.push([id,DOW[x.dow-1],STATUS[x.status],x.tag?x.tag.name:"",(x.secs/3600).toFixed(2),x.tasks,x.notes,x.photos.length])});
  return rows.map(r=>r.map(v=>/[",\n]/.test(v)?`"${String(v).replace(/"/g,'""')}"`:v).join(",")).join("\n");
}
function exportSheet(title,text){
  sheet(`<div class="stack"><div class="row between"><h2>${title}</h2><button class="icon-btn" data-close aria-label="Close">${ic.x}</button></div>
  <textarea class="export" id="exp" readonly></textarea>
  ${APP?`<button class="btn primary full" id="shr">${ic.up}Share or save…</button><button class="btn ghost full" id="cp">${ic.copy}Copy to clipboard</button>`:`<button class="btn primary full" id="cp">${ic.copy}Copy to clipboard</button>`}
  <p class="note" style="margin:0">${APP?"Send it to Drive, email, WhatsApp or Files — or paste it into Google Sheets or Excel.":"Paste it into Google Sheets, Excel or a text file. The Android app can share or save a file instead."}</p></div>`,(el)=>{
    const ta=el.querySelector("#exp");ta.value=text;
    el.querySelector("#shr")?.addEventListener("click",()=>{try{APP.share(title,text)}catch(e){toast("Couldn't open sharing — use Copy instead")}});
    // clipboard API first; if the page isn't allowed to use it, select the text and try the older copy command
    el.querySelector("#cp").onclick=async()=>{try{await navigator.clipboard.writeText(text);toast("Copied")}catch(e){
      ta.focus();ta.select();let ok=false;try{ok=document.execCommand("copy")}catch(_){}
      toast(ok?"Copied":"Selected — press Ctrl+C / ⌘C to copy")}};
  });
}

/* confetti */
function celebrate(){
  if(matchMedia("(prefers-reduced-motion: reduce)").matches)return;
  const c=$("#confetti"),x=c.getContext("2d"),run=celebrate.run=(celebrate.run||0)+1;c.hidden=false;c.width=innerWidth;c.height=innerHeight;
  const th=theme(),cols=[...th.pal,...th.g,"#FBBF24"];
  const P=Array.from({length:90},()=>({x:innerWidth/2,y:innerHeight*.45,vx:(Math.random()-.5)*14,vy:-Math.random()*13-4,r:Math.random()*6+3,c:cols[Math.random()*cols.length|0],a:Math.random()*6}));
  let f=0;(function step(){if(run!==celebrate.run)return;x.clearRect(0,0,c.width,c.height);P.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=.45;p.vx*=.99;p.a+=.2;x.save();x.translate(p.x,p.y);x.rotate(p.a);x.fillStyle=p.c;x.fillRect(-p.r/2,-p.r/4,p.r,p.r/2);x.restore()});
    if(++f<90)requestAnimationFrame(step);else{c.hidden=true}})();
}

function importFile(f,ask=true){
  const rd=new FileReader();
  rd.onload=()=>{let d;try{d=JSON.parse(rd.result);if(!validBackup(d))throw 0}catch(err){toast("That file isn't a Work Log backup. Pick a WorkLog-backup .json file.");return}
    const go=()=>{S=fromBackup(d);U.open=undefined;save();render();applyScene();syncReminder();toast("Backup restored")};
    const n=Object.values(d.entries).filter(r=>r&&Object.keys(r).some(k=>k!=="off")).length,when=d.backupAt?` from ${whenTxt(Date.parse(d.backupAt))}`:"";
    if(!ask||!hasData(S))go();else confirmSheet("Restore this backup?",`It has ${n} logged day${n===1?"":"s"}${when}. Everything currently in the app will be replaced.`,"Replace my data",go)};
  rd.onerror=()=>toast("Couldn't read that file");rd.readAsText(f);
}

    <label class="btn primary full" for="wimp" style="cursor:pointer">${ic.up}Restore from backup</label>
    <input type="file" id="wimp" accept=".json,application/json" hidden>
    <button class="btn ghost full" data-close>Start fresh</button></div>`,(el,close)=>{

      ["Clear tasks & notes",ic.x,()=>{const s=snapshot(id);const r=raw(id);r.tasks="";r.notes="";if(autoEmpty(id)){delete r.status;delete r.auto}save();refreshCard(id);refreshQuestSoon();refreshHeader();toast("Text cleared",()=>restore(id,s))}],
      ["Reset day",ic.reset,()=>{const s=snapshot(id);if(S.timer&&S.timer.id===id)S.timer=null;delete S.entries[id];if(s.off!==undefined)raw(id).off=s.off;save();refreshCard(id);refreshStatsSoon();toast("Day reset",()=>restore(id,s))},true]]);return}
