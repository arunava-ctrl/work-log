<script>
// Before anything paints: keep the screens hidden until the first render (no half-built Home flashing on reload),
// and set the saved light/dark choice now so the background is already right. The timeout is a safety net.
(()=>{const r=document.documentElement;r.classList.add("boot");if(!window.WorkLogApp)r.classList.add("web");setTimeout(()=>r.classList.remove("boot"),2500);
try{const t=(JSON.parse(localStorage.getItem("worklog.preview.v1"))||{}).theme;if(t==="dark")r.classList.add("app-dark");else if(t==="light")r.classList.add("app-light")}catch(e){}})();
</script>

<style>
:root{
  --bg:#FAFAFA; --dot:rgba(9,9,11,.07);
  --surface:#FFFFFF; --surface2:#F4F4F5; --container:#F4F4F5; --outline:#E4E4E7; --outline-strong:#D4D4D8;
  --text:#09090B; --muted:#71717A; --faint:#A1A1AA;
  --accent:#5B5BF6; --accent-2:#8B7CFF; --accent-soft:rgba(91,91,246,.10); --on-accent:#FFFFFF;
  --primary:var(--accent); --primary-soft:var(--accent-soft); --on-primary:var(--on-accent); --acc:var(--accent);
  --done:#16A34A; --done-bg:rgba(22,163,74,.09);
  --progress:#D97706; --progress-bg:rgba(217,119,6,.10);
  --pending:#52525B; --pending-bg:rgba(82,82,91,.07);

  --shadow-lg:0 24px 60px -12px rgba(9,9,11,.25);
  --heat0:#EFEFF1; --heat1:#C7C6FB; --heat2:#8E8CF8; --heat3:#5B5BF6;
  --glass-tint:transparent; --glass-edge:rgba(255,255,255,.5); --glass-lens:rgba(255,255,255,.08); --glass-spec:.55; --glass-ts:rgba(255,255,255,.7); --glass-rim:0 10px 30px -6px rgba(9,9,11,.18),0 2px 6px rgba(9,9,11,.06),inset 0 1px 0 rgba(255,255,255,.85),inset 0 -1px 0 rgba(255,255,255,.3),inset 1px 0 0 rgba(255,255,255,.35),inset -1px 0 0 rgba(255,255,255,.35),inset 0 0 14px rgba(255,255,255,.18),inset 0 -8px 16px -10px rgba(9,9,11,.12); --glass-hair:rgba(9,9,11,.10); --lens-tint:transparent; --lens-bright:1; --dock-bright:1;
  --scrim:rgba(9,9,11,.35);
  --ui:"Geist",ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --mono:"Geist Mono",ui-monospace,"SF Mono",Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]):not(.app-light){
    color-scheme:dark;
    --bg:#09090B; --dot:rgba(255,255,255,.06);
    --surface:#111113; --surface2:#18181B; --container:#18181B; --outline:#26262B; --outline-strong:#34343B;
    --text:#FAFAFA; --muted:#A1A1AA; --faint:#63636B;
    --accent:#8583FF; --accent-2:#B4A8FF; --accent-soft:rgba(133,131,255,.14); --on-accent:#0B0B1A;

    --pending:#D4D4D8; --pending-bg:rgba(212,212,216,.06);
    --off:#71717A; --off-bg:rgba(113,113,122,.12);
    --danger:#F87171;
    --shadow-sm:0 1px 2px rgba(0,0,0,.4);

    --heat0:#1C1C21; --heat1:#2E2D6B; --heat2:#5451C9; --heat3:#8583FF;
    --glass-tint:transparent; --glass-edge:rgba(255,255,255,.14); --glass-lens:rgba(255,255,255,.05); --glass-spec:.22; --glass-ts:rgba(0,0,0,.55); --glass-rim:0 12px 34px -6px rgba(0,0,0,.6),0 2px 6px rgba(0,0,0,.3),inset 0 1px 0 rgba(255,255,255,.28),inset 0 -1px 0 rgba(255,255,255,.06),inset 1px 0 0 rgba(255,255,255,.1),inset -1px 0 0 rgba(255,255,255,.1),inset 0 0 14px rgba(255,255,255,.05),inset 0 -8px 16px -10px rgba(0,0,0,.4); --glass-hair:rgba(255,255,255,.12); --lens-tint:transparent; --lens-bright:1; --dock-bright:.8;
    --scrim:rgba(0,0,0,.6);
  }
}
:root[data-theme="dark"]:not(.app-light), :root.app-dark{
    color-scheme:dark;
    --bg:#09090B; --dot:rgba(255,255,255,.06);
    --surface:#111113; --surface2:#18181B; --container:#18181B; --outline:#26262B; --outline-strong:#34343B;
    --text:#FAFAFA; --muted:#A1A1AA; --faint:#63636B;
    --accent:#8583FF; --accent-2:#B4A8FF; --accent-soft:rgba(133,131,255,.14); --on-accent:#0B0B1A;
    --done:#4ADE80; --done-bg:rgba(74,222,128,.10);
    --progress:#FBBF24; --progress-bg:rgba(251,191,36,.10);
    --pending:#D4D4D8; --pending-bg:rgba(212,212,216,.06);
    --off:#71717A; --off-bg:rgba(113,113,122,.12);
    --danger:#F87171;

}
:root.app-light{color-scheme:light}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{background:var(--bg)}
body{color:var(--text);font-family:var(--ui);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased;
  background-image:radial-gradient(var(--dot) 1px,transparent 1px);background-size:22px 22px;background-attachment:fixed}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0;align-items:normal} /* older WebViews default buttons to flex-start, which collapsed the month calendars */
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:8px}
/* touch taps must never leave a focus box (Android WebView draws one on some tablets) */
:focus:not(:focus-visible){outline:none}
@media (hover:none){:focus-visible{outline:none}}
button,[role="switch"],.dock{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.app{max-width:780px;margin:0 auto;padding:6px 16px 120px}
.num{font-variant-numeric:tabular-nums}
.eyebrow{font-size:11px;font-weight:500;letter-spacing:.02em;color:var(--muted)}
.card{background:var(--surface);border:1px solid var(--outline);border-radius:16px;padding:16px;box-shadow:var(--shadow-sm)}
.row{display:flex;align-items:center;gap:10px}
.between{justify-content:space-between}
.stack{display:flex;flex-direction:column;gap:12px}
.icon-btn{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;background:var(--surface);border:1px solid var(--outline);color:var(--muted);flex:none;box-shadow:var(--shadow-sm);transition:color .15s,border-color .15s,background .15s}
.icon-btn:hover{color:var(--text);border-color:var(--outline-strong);background:var(--surface2)}
.icon-btn svg{width:17px;height:17px}
svg{display:block}

/* header */
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;padding:18px 0 14px}
.year-btn{display:inline-flex;align-items:center;gap:12px;font-size:40px;font-weight:600;letter-spacing:-.045em;line-height:1;padding:6px 8px 6px 6px;margin-left:-6px;border-radius:14px;border:1px solid transparent;transition:background .15s,border-color .15s}
.year-btn:hover,.year-btn[aria-expanded="true"]{background:var(--surface);border-color:var(--outline);box-shadow:var(--shadow-sm)}
.yb-chev{width:28px;height:28px;border-radius:9px;display:grid;place-items:center;border:1px solid var(--outline);background:var(--surface);box-shadow:var(--shadow-sm);color:var(--muted);transition:transform .25s cubic-bezier(.3,1.3,.5,1),color .15s,background .15s}
.yb-chev svg{width:15px;height:15px}
.year-btn:hover .yb-chev{color:var(--text)}
.year-btn[aria-expanded="true"] .yb-chev{transform:rotate(180deg);background:var(--text);color:var(--bg);border-color:var(--text)}
.ypop{position:absolute;z-index:40;width:min(340px,calc(100vw - 32px));background:var(--surface);border:1px solid var(--outline);border-radius:18px;box-shadow:var(--shadow-lg);padding:14px;animation:pop .18s cubic-bezier(.2,.9,.3,1);transform-origin:top left}
.yp-range{font-size:15px;font-weight:600;letter-spacing:-.02em;margin-top:2px}
.yp-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:12px}
.yp-cell{display:flex;flex-direction:column;align-items:stretch;gap:7px;padding:10px 10px 9px;border-radius:12px;border:1px solid var(--outline);background:var(--surface);text-align:left;transition:background .15s,border-color .15s,transform .12s}
.yp-cell:hover{background:var(--surface2);border-color:var(--outline-strong)}
.yp-cell:active{transform:scale(.97)}
.yp-y{font-size:16px;font-weight:600;letter-spacing:-.03em;display:flex;align-items:center;gap:6px}
.yp-now{width:6px;height:6px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.spark{display:flex;gap:2px;align-items:flex-end;height:16px}
.spark i{flex:1;border-radius:1.5px;background:var(--outline)}
.spark i.on{background:linear-gradient(to top,var(--accent),var(--accent-2))}
.yp-n{font-family:var(--mono);font-size:10.5px;color:var(--faint)}
.yp-cell[aria-selected="true"]{background:var(--text);color:var(--bg);border-color:var(--text);box-shadow:var(--shadow)}
.yp-cell[aria-selected="true"] .spark i{background:color-mix(in srgb,var(--bg) 22%,transparent)}
.yp-cell[aria-selected="true"] .spark i.on{background:var(--accent-2)}
.yp-cell[aria-selected="true"] .yp-n{color:color-mix(in srgb,var(--bg) 60%,transparent)}
.yp-cell[aria-selected="true"] .yp-now{box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 40%,transparent)}
.yp-foot{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:12px;padding-top:10px;border-top:1px solid var(--outline)}
.yp-key{display:inline-block;width:10px;height:8px;border-radius:2px;background:linear-gradient(to top,var(--accent),var(--accent-2));margin-right:7px;vertical-align:0}
.greeting{font-size:13px;color:var(--muted);display:inline-flex;align-items:center;gap:8px;margin-bottom:6px}
.greeting::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--done);box-shadow:0 0 0 3px var(--done-bg)}

.linkbtn{color:var(--accent);font-weight:600;font-size:13px}
.linkbtn:hover{text-decoration:underline;text-underline-offset:3px}


/* month tiles */
.months{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
@media (min-width:600px){.months{grid-template-columns:repeat(3,1fr)}}
@media (min-width:760px){.months{grid-template-columns:repeat(4,1fr)}}
.mcard{position:relative;display:flex;flex-direction:column;gap:12px;padding:14px;border-radius:16px;background:var(--surface);border:1px solid var(--outline);text-align:left;box-shadow:var(--shadow-sm);transition:transform .2s cubic-bezier(.2,.8,.3,1),box-shadow .2s,border-color .2s;max-width:100%}
@media (hover:hover){.mcard:hover{transform:translateY(-2px);box-shadow:var(--shadow);border-color:var(--outline-strong)}}
.mcard.now{background:linear-gradient(var(--surface),var(--surface)) padding-box,linear-gradient(135deg,var(--accent),var(--accent-2) 60%,var(--outline)) border-box;border:1px solid transparent;box-shadow:0 0 0 4px var(--accent-soft),var(--shadow-sm)}
.mc-top{display:flex;align-items:center;justify-content:space-between;gap:6px}
.mc-name{font-size:15px;font-weight:600;letter-spacing:-.02em}
.mc-now{font-family:var(--mono);font-size:10px;font-weight:600;color:var(--on-accent);background:var(--accent);padding:2px 6px;border-radius:6px;margin-left:6px;vertical-align:2px}
.mcard .dots{width:26px;height:26px;border-radius:8px;display:grid;place-items:center;color:var(--faint)}
.mcard .dots:hover{background:var(--surface2);color:var(--text)}
.mcard .dots svg{width:15px;height:15px}
.mini{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}
.mini i{aspect-ratio:1;border-radius:3px;background:var(--heat0)}
.mini i.b{background:transparent}
.mini i.off{background:transparent;box-shadow:inset 0 0 0 1px var(--outline)}
.mini i.has{background:var(--heat1)}.mini i.progress{background:var(--heat2)}.mini i.done{background:var(--heat3)}
.mini i.today{box-shadow:0 0 0 1.5px var(--surface),0 0 0 2.5px var(--text)}
.mc-foot{display:flex;justify-content:space-between;gap:6px;flex-wrap:wrap;font-size:11.5px;color:var(--muted);font-family:var(--mono)}
.mc-foot b{color:var(--text);font-weight:600}

/* menus */
.menu{position:absolute;z-index:40;min-width:210px;background:var(--surface);color:var(--text);border:1px solid var(--outline);border-radius:12px;box-shadow:var(--shadow-lg);padding:4px;animation:pop .14s ease-out}
.menu button{display:flex;align-items:center;gap:10px;width:100%;padding:8px 10px;border-radius:8px;font-weight:500;font-size:13.5px;text-align:left}
.menu button:hover,.menu button:focus-visible{background:var(--surface2);outline:none}
.menu button.danger{color:var(--danger)}
.menu svg{width:15px;height:15px;color:var(--muted)}
.menu button.danger svg{color:var(--danger)}
@keyframes pop{from{opacity:0;transform:scale(.97) translateY(-4px)}}

/* work log */
.mhead{display:flex;align-items:flex-end;justify-content:space-between;flex-wrap:wrap;gap:10px;padding:18px 0 4px}
.mhead h1{margin:0;font-size:clamp(26px,7.5vw,32px);font-weight:600;letter-spacing:-.045em;line-height:1.05;display:flex;align-items:baseline;gap:8px}
.mhead h1 i{display:none}
.mhead h1 .num{color:var(--faint)}
.pillnav{display:flex;background:var(--surface);border:1px solid var(--outline);border-radius:10px;padding:2px;box-shadow:var(--shadow-sm)}
.pillnav button{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;color:var(--muted)}
.pillnav button:hover{color:var(--text);background:var(--surface2)}
.pillnav svg{width:16px;height:16px}

.summary{background:linear-gradient(120deg,var(--accent-soft),transparent 55%),var(--surface)}
.summary p{margin:8px 0 0;font-size:14px;line-height:1.6;text-wrap:pretty;color:var(--muted)}
.summary p b{color:var(--text);font-weight:600}
.summary .ic{width:26px;height:26px;border-radius:8px;display:grid;place-items:center;background:linear-gradient(135deg,var(--accent),var(--accent-2));color:#fff}
.summary .ic svg{width:14px;height:14px}

.stats{display:grid;grid-template-columns:1.15fr 1fr 1fr;gap:10px}
.stats .card{padding:14px}
.ring{grid-row:span 2;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px}
.ring .pct{font-size:26px;font-weight:600;letter-spacing:-.04em}
.stat .v{font-size:26px;font-weight:600;letter-spacing:-.04em;line-height:1.15;margin-top:6px}
.stat .s{font-size:12px;color:var(--muted)}
.stat .eyebrow{display:flex;align-items:center;gap:6px}
@media (max-width:420px){.stats{grid-template-columns:1fr 1fr}.ring{grid-column:span 2;grid-row:auto;flex-direction:row;justify-content:flex-start;gap:14px}}

.chart text{font-family:var(--mono);font-size:9.5px;fill:var(--faint)}
.chart .grid{stroke:var(--outline);stroke-width:1;stroke-dasharray:2 4}
.key{display:flex;gap:12px;font-size:12px;color:var(--muted)}
.key i{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:6px;vertical-align:0}

.chips{display:flex;gap:6px;overflow-x:auto;padding:2px 0 4px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 11px;border-radius:999px;border:1px solid var(--outline);font-size:12.5px;font-weight:500;color:var(--muted);background:var(--surface);transition:all .15s}
.chip:hover{color:var(--text);border-color:var(--outline-strong)}
.chip[aria-pressed="true"]{background:var(--text);color:var(--bg);border-color:var(--text)}
.chip i{width:7px;height:7px;border-radius:50%;background:var(--c)}

.todaytag{font-family:var(--mono);font-size:10px;font-weight:600;color:var(--accent);background:var(--accent-soft);padding:2px 6px;border-radius:6px;margin-left:8px;vertical-align:1px}
.timer{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 9px 0 7px;border-radius:8px;background:var(--surface);border:1px solid var(--outline);font-family:var(--mono);font-size:12px;font-weight:500;color:var(--muted)}
.timer:hover{color:var(--text);border-color:var(--outline-strong)}
.timer svg{width:12px;height:12px}
.timer.run{color:var(--on-accent);background:var(--accent);border-color:transparent;box-shadow:0 0 0 4px var(--accent-soft)}
.timer.run svg{animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{50%{opacity:.35}}
.tagpill{display:inline-flex;align-items:center;gap:6px;height:26px;padding:0 9px;border-radius:999px;font-size:12px;font-weight:500;color:var(--muted);background:var(--surface);border:1px solid var(--outline)}
.tagpill:hover{border-color:var(--outline-strong);color:var(--text)}
.tagpill i{width:7px;height:7px;border-radius:50%;background:var(--c,var(--faint))}
.tagpill[style]{color:var(--text)}
textarea{width:100%;resize:none;border:1px solid var(--outline);background:var(--surface2);border-radius:10px;padding:10px 12px;font-size:14px;line-height:1.5;outline:none;min-height:42px;overflow:hidden;transition:border-color .15s,box-shadow .15s,background .15s}
textarea.notes{font-size:13px;color:var(--muted)}
textarea:hover{border-color:var(--outline-strong)}
textarea:focus{border-color:var(--accent);background:var(--surface);box-shadow:0 0 0 4px var(--accent-soft)}
textarea::placeholder{color:var(--faint)}
.empty{text-align:center;color:var(--muted);padding:28px 10px}

/* ===== quest card: streak flame + level + week strip ===== */
.quest{position:relative;overflow:hidden;border:1px solid var(--outline);border-radius:20px;padding:16px;display:flex;flex-direction:column;gap:14px;box-shadow:var(--shadow-sm);
  background:radial-gradient(120% 100% at 0% 0%,color-mix(in srgb,var(--f1) 22%,transparent),transparent 55%),radial-gradient(90% 80% at 100% 0%,var(--accent-soft),transparent 60%),var(--surface)}
.q-top{display:flex;align-items:center;gap:14px}
.q-flame{position:relative;width:64px;height:76px;flex:none;display:grid;place-items:end center}
.flame{position:absolute;inset:0 4px 6px;display:block;filter:drop-shadow(0 6px 14px color-mix(in srgb,var(--f1) 55%,transparent))}
.fl-out svg,.fl-in svg{display:block;width:100%;height:100%}
.fl-out,.fl-in{position:absolute;inset:0;display:block;will-change:transform;animation-duration:2s;animation-timing-function:ease-in-out;animation-iteration-count:infinite;animation-delay:var(--ph,0ms)}
.fl-out{transform-origin:50% 92%;animation-name:flick}
.fl-in{transform-origin:50% 95%;animation-name:flick2}
@keyframes flick{0%,100%{transform:scale(1,1) skewX(0)}25%{transform:scale(.97,1.04) skewX(-1.5deg)}50%{transform:scale(1.02,.98) skewX(1deg)}75%{transform:scale(.985,1.025) skewX(-.8deg)}}
@keyframes flick2{0%,100%{transform:scale(1,1) skewX(0)}25%{transform:scale(.94,1.08) skewX(-2.5deg)}50%{transform:scale(1.04,.95) skewX(1.8deg)}75%{transform:scale(.97,1.05) skewX(-1.2deg)}}
.t-ember .fl-out,.t-ember .fl-in{animation:none}.t-ember .flame{filter:none;opacity:.7}
/* theme emblems: the number sits in the middle of each shape, and each shape moves its own way */
.em-sunset .q-num,.em-blossom .q-num{margin-bottom:14px}
.em-ocean .q-num{margin-bottom:12px}
.em-forest .q-num{margin-bottom:19px}
.em-galaxy .q-num{margin-bottom:15px}
.em-frost .q-num{margin-bottom:14px}
.quest:not(.t-ember).em-sunset .fl-out{transform-origin:50% 59.6%;animation-name:em-rot45;animation-duration:6s;animation-timing-function:linear}
.quest:not(.t-ember).em-sunset .fl-in,.quest:not(.t-ember).em-blossom .fl-in,.quest:not(.t-ember).em-frost .fl-in{transform-origin:50% 59.6%;animation-name:em-pulse}
.quest:not(.t-ember).em-blossom .fl-out{transform-origin:50% 59.6%;animation-name:em-bloom;animation-duration:3s}
.quest:not(.t-ember).em-ocean .fl-out,.quest:not(.t-ember).em-ocean .fl-in{transform-origin:50% 94%;animation-name:em-bob;animation-duration:3s}
.quest:not(.t-ember).em-forest .fl-out,.quest:not(.t-ember).em-forest .fl-in{transform-origin:50% 96%;animation-name:em-sway;animation-duration:3s}
.quest:not(.t-ember).em-galaxy .fl-out{transform-origin:50% 59.6%;animation-name:em-twinkle;animation-duration:3s}
.quest:not(.t-ember).em-galaxy .fl-in{transform-origin:83.8% 18.3%;animation-name:em-spark}
.quest:not(.t-ember).em-frost .fl-out{transform-origin:50% 59.6%;animation-name:em-rot60;animation-duration:6s;animation-timing-function:linear}
/* the leaf sways and the drop bobs away from their centre, so the number rides along (same pivot, timing and phase) */
.quest:not(.t-ember).em-forest .q-num{transform-origin:50% 49px;animation:em-sway 3s ease-in-out var(--ph,0ms) infinite}
.quest:not(.t-ember).em-ocean .q-num{transform-origin:50% 41px;animation:em-bob 3s ease-in-out var(--ph,0ms) infinite}
@keyframes em-rot45{to{transform:rotate(45deg)}}
@keyframes em-rot60{to{transform:rotate(60deg)}}
@keyframes em-pulse{50%{transform:scale(1.12)}}
@keyframes em-bloom{0%,100%{transform:rotate(-8deg)}50%{transform:rotate(8deg) scale(1.05)}}
@keyframes em-bob{0%,100%{transform:translateY(0) scale(1)}50%{transform:translateY(-3px) scale(.96,1.04)}}
@keyframes em-sway{0%,100%{transform:rotate(-6deg)}50%{transform:rotate(6deg)}}
@keyframes em-twinkle{0%,100%{transform:scale(1) rotate(0)}50%{transform:scale(1.07) rotate(8deg)}}
@keyframes em-spark{0%,100%{transform:scale(.45);opacity:.5}50%{transform:scale(1.15);opacity:1}}
.q-num{position:relative;z-index:1;font-size:26px;font-weight:700;letter-spacing:-.04em;color:#fff;text-shadow:0 1px 6px rgba(0,0,0,.45);margin-bottom:10px}
.q-main{flex:1;min-width:0}
.q-title{font-size:22px;font-weight:700;letter-spacing:-.035em;line-height:1.15;margin-top:2px}
.q-sub{font-size:12.5px;color:var(--muted);margin-top:2px}
.q-level{display:flex;flex-direction:column;align-items:center;gap:4px;flex:none}
/* the hexagon is drawn as an SVG shape: a clip-path can be dropped while the card animates or redraws, which showed a square */
.lv-badge{position:relative;width:52px;height:58px;display:grid;place-items:center;align-content:center;color:#fff;line-height:1}
.lv-hex{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.lv-badge span,.lv-badge b{position:relative}
.lv-badge span{font-size:9.5px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;opacity:.85}
.lv-badge b{font-size:22px;font-weight:700;letter-spacing:-.04em}
.lv-name{font-size:11px;font-weight:600;color:var(--muted)}
.xp-bar{height:9px;border-radius:99px;background:var(--surface2);overflow:hidden;box-shadow:inset 0 1px 2px rgba(0,0,0,.12)}
.xp-bar i{display:block;height:100%;border-radius:inherit;background:linear-gradient(90deg,var(--accent),var(--accent-2));position:relative;overflow:hidden;transition:width .6s cubic-bezier(.3,1.3,.5,1)}
.xp-bar i::after{content:"";position:absolute;inset:0;background:linear-gradient(100deg,transparent 30%,rgba(255,255,255,.45) 50%,transparent 70%);animation:shine 3s ease-in-out infinite;animation-delay:var(--ph,0ms)}
@keyframes shine{from{translate:-100% 0}to{translate:100% 0}}
.xp-txt{display:flex;justify-content:space-between;font-size:11.5px;color:var(--muted);margin-top:6px;font-family:var(--mono)}
.strip{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.sd{position:relative;display:flex;flex-direction:column;align-items:center;gap:5px;padding:2px 0}
.sd-dow{font-size:10.5px;font-weight:600;color:var(--faint);font-family:var(--mono);line-height:16px}
.sd-dot{position:relative;z-index:1;width:32px;height:32px;border-radius:50%;display:grid;place-items:center;border:2px solid var(--outline-strong);background:var(--surface);transition:transform .2s}
.sd:hover .sd-dot{transform:scale(1.08)}
.sd-dot svg{width:15px;height:15px}
.s-done .sd-dot{background:linear-gradient(135deg,var(--accent),var(--accent-2));border-color:transparent;color:#fff;box-shadow:0 3px 10px -2px color-mix(in srgb,var(--accent) 60%,transparent)}
.s-progress .sd-dot{border-color:var(--progress);background:var(--progress-bg)}
.s-progress .sd-dot::after,.chk-progress::after{content:"";width:9px;height:9px;border-radius:50%;background:var(--progress);animation:live 2s ease-in-out infinite;animation-delay:var(--ph,0ms)}
/* pulses use scale/opacity only: a box-shadow pulse repaints on the main thread every frame */
@keyframes live{50%{scale:.7;opacity:.55}}
.s-has .sd-dot{background:var(--accent-soft);border-color:var(--accent)}
.s-missed .sd-dot{border-style:dashed;opacity:.75}
.s-off .sd-dot{border-style:dotted;opacity:.55}
.s-future .sd-dot{opacity:.45}
.sd.is-today .sd-dow{color:var(--accent)}
.sd.is-today .sd-dot{box-shadow:0 0 0 3px var(--accent-soft)}
.sd.is-today .sd-dot::before{content:"";position:absolute;inset:-2px;border-radius:50%;box-shadow:0 0 0 3px var(--accent-soft);pointer-events:none;animation:todayPulse 2s ease-in-out infinite;animation-delay:var(--ph,0ms)}
@keyframes todayPulse{50%{scale:1.2;opacity:0}}
/* chain: consecutive logged days are linked like a streak; the line runs through the dot centres (2px pad + 16px label + 5px gap + 16px) */
.sd.chain::before{content:"";position:absolute;top:37px;right:50%;width:100%;height:4px;background:linear-gradient(90deg,var(--accent),var(--accent-2));opacity:.55;border-radius:4px}
.q-goal{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--muted);padding-top:12px;border-top:1px solid var(--outline);flex-wrap:wrap}
.q-goal b{color:var(--text);font-weight:600}
.q-goal .linkbtn{margin-left:auto}
.q-goal>span:nth-child(2){flex:1 1 170px;min-width:0}
.q-gring{width:18px;height:18px;border-radius:50%;flex:none;background:conic-gradient(var(--accent) calc(var(--p)*360deg),var(--surface2) 0);-webkit-mask:radial-gradient(circle,transparent 5px,#000 5.5px);mask:radial-gradient(circle,transparent 5px,#000 5.5px)}

/* ===== achievements ===== */
.badges{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 6px;scrollbar-width:none}
.badges::-webkit-scrollbar{display:none}
.bdg{flex:none;width:98px;display:flex;flex-direction:column;align-items:center;gap:6px;padding:12px 8px 10px;border-radius:14px;border:1px solid var(--outline);background:var(--surface);text-align:center}
.bdg-ic{position:relative;width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--surface2);color:var(--faint)}
.bdg-ic>svg{width:19px;height:19px}
.bdg-lock{position:absolute;right:-3px;bottom:-3px;width:17px;height:17px;border-radius:50%;display:grid;place-items:center;background:var(--surface);border:1px solid var(--outline);color:var(--muted)}
.bdg-lock svg{width:9px;height:9px}
.bdg-t{font-size:12px;font-weight:600;line-height:1.2}
.bdg-p{font-size:10.5px;color:var(--faint);font-family:var(--mono)}
.bdg.got{border-color:color-mix(in srgb,var(--accent) 35%,var(--outline));background:linear-gradient(180deg,var(--accent-soft),transparent 70%),var(--surface)}
.bdg.got .bdg-ic{background:linear-gradient(135deg,#FBBF24,#F59E0B 45%,#EA580C);color:#fff;box-shadow:0 4px 12px -3px rgba(234,88,12,.55),inset 0 1px 0 rgba(255,255,255,.5)}
.bdg.got .bdg-p{color:var(--accent)}
.bdg:not(.got) .bdg-t{color:var(--muted)}

/* ===== view switch ===== */
.view-seg button{display:inline-flex;align-items:center;justify-content:center;gap:6px}
.seg-n{font-family:var(--mono);font-size:11px;color:var(--faint)}

/* ===== week groups + compact day rows ===== */
#list{display:flex;flex-direction:column;gap:18px}
.wk{display:flex;flex-direction:column;gap:6px}
.wk-head{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:0 4px 2px}
.wk-head b{font-size:13px;font-weight:600}
.wk-range{font-size:11.5px;color:var(--faint);font-family:var(--mono);margin-left:8px}
.wk-prog{display:flex;align-items:center;gap:8px;font-size:11.5px;color:var(--muted);font-family:var(--mono)}
.wk-dots{display:flex;gap:3px}
.wk-dots i{width:8px;height:8px;border-radius:50%;background:var(--surface2);box-shadow:inset 0 0 0 1px var(--outline-strong)}
.wk-dots i.half{background:var(--accent-soft);box-shadow:inset 0 0 0 1px var(--accent)}
.wk-dots i.on{background:var(--accent);box-shadow:none}
.crown{display:inline-flex;align-items:center;gap:4px;font-family:var(--ui);font-weight:600;font-size:11px;color:#B45309;background:linear-gradient(135deg,#FEF3C7,#FDE68A);padding:2px 8px 2px 6px;border-radius:99px}
.crown svg{width:12px;height:12px}
.wk-days{display:flex;flex-direction:column;gap:6px}
.wk-off{display:flex;align-items:center;gap:6px;padding:0 4px;font-size:11.5px;color:var(--faint)}
.offchip{height:24px;padding:0 9px;border-radius:99px;border:1px dashed var(--outline-strong);font-size:11.5px;color:var(--muted);font-family:var(--mono)}
.offchip:hover{color:var(--text);border-color:var(--accent)}

.drow{background:var(--surface);border:1px solid var(--outline);border-radius:14px;padding:8px 8px 8px 10px;transition:border-color .2s,box-shadow .2s,background .2s}
.drow:hover{border-color:var(--outline-strong)}
.drow.today{background:linear-gradient(var(--surface),var(--surface)) padding-box,linear-gradient(135deg,var(--accent),var(--accent-2) 50%,var(--outline)) border-box;border:1px solid transparent;box-shadow:0 0 0 3px var(--accent-soft)}
.drow.is-done{background:linear-gradient(90deg,color-mix(in srgb,var(--accent) 7%,transparent),transparent 60%),var(--surface)}
.drow.future{opacity:.62}
.drow.open{box-shadow:var(--shadow);border-color:var(--outline-strong)}
.drow.today.open{box-shadow:0 0 0 3px var(--accent-soft),var(--shadow)}
.dr-head{display:flex;align-items:center;gap:10px}
.chk{width:28px;height:28px;border-radius:50%;flex:none;display:grid;place-items:center;border:2px solid var(--outline-strong);color:#fff;transition:transform .15s,background .2s,border-color .2s}
.chk:hover{transform:scale(1.1);border-color:var(--accent)}
.chk:active{transform:scale(.88)}
.chk svg{width:14px;height:14px}
.chk-progress{border-color:var(--progress);background:var(--progress-bg)}
.chk-done{border-color:transparent;background:linear-gradient(135deg,var(--accent),var(--accent-2));box-shadow:0 3px 10px -3px color-mix(in srgb,var(--accent) 70%,transparent)}
.chk-off{border-style:dotted}
.missed .chk{border-style:dashed}
.gaprow{display:flex;align-items:center;gap:10px;width:100%;padding:10px 12px;border-radius:14px;border:1px dashed var(--outline-strong);color:var(--muted);font-size:13px;text-align:left;transition:border-color .2s,background .2s}
.gaprow:hover{border-color:var(--accent);background:var(--surface)}
.gap-dots{display:flex;gap:3px;flex:none}
.gap-dots i{width:8px;height:8px;border-radius:50%;border:1.5px dashed var(--outline-strong)}
.gap-t{flex:1;min-width:0}
.gap-t .num{color:var(--faint);font-family:var(--mono);font-size:11.5px}
.gap-cta{font-weight:600;font-size:12.5px;color:var(--accent);flex:none}
.chk.pop{animation:chkpop .45s cubic-bezier(.3,1.8,.5,1)}
@keyframes chkpop{0%{transform:scale(.6)}60%{transform:scale(1.25)}100%{transform:scale(1)}}
.dr-main{flex:1;min-width:0;display:flex;align-items:center;gap:12px;text-align:left;padding:2px 0;border-radius:10px}
.dr-date{width:32px;flex:none;display:flex;flex-direction:column;align-items:center;line-height:1.05}
.dr-dow{font-size:10px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--faint);font-family:var(--mono)}
.dr-d{font-size:18px;font-weight:600;letter-spacing:-.03em}
.today .dr-dow{color:var(--accent)}
.dr-body{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.dr-title{font-size:14px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dr-title.ph{color:var(--faint);font-weight:400}
.missed .dr-title.ph{color:var(--faint)}
.dr-meta{display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-size:11.5px;color:var(--muted)}
.dr-meta:empty{display:none}
.dr-tag{display:inline-flex;align-items:center;gap:5px}
.dr-tag i{width:7px;height:7px;border-radius:50%;background:var(--c)}
.dr-time{font-family:var(--mono)}
.dr-time.run{color:var(--accent);font-weight:600}
.dr-time.run::before{content:"";display:inline-block;width:6px;height:6px;border-radius:50%;background:currentColor;margin-right:5px;vertical-align:1px;animation:pulse 1.2s infinite}
.dr-note{padding:0 6px;border-radius:5px;background:var(--surface2);font-size:10.5px}
.dr-xp{flex:none;display:flex;flex-direction:column;align-items:center;line-height:1.05;font-family:var(--mono);font-size:12px;font-weight:700;color:var(--accent)}
.dr-xp small{font-size:9px;font-weight:600;opacity:.75}
.dr-chev{flex:none;color:var(--faint);transition:rotate .25s cubic-bezier(.3,1.4,.5,1)}
.dr-chev svg{width:16px;height:16px}
.open .dr-chev{rotate:90deg;color:var(--text)}
.dr-edit{display:flex;flex-direction:column;gap:8px;margin:10px 0 2px 38px}
.drow.opening .dr-edit{animation:drin .25s cubic-bezier(.2,.9,.3,1)}
@keyframes drin{from{opacity:0;translate:0 -4px}}
@media (max-width:420px){.dr-edit{margin-left:0}}
.dr-tools{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.mantime{display:inline-flex;align-items:center;gap:5px;height:28px;padding:0 10px 0 8px;border-radius:8px;font-size:12px;font-weight:500;color:var(--muted);background:transparent;border:1px dashed var(--outline-strong)}
.mantime svg{width:12px;height:12px}
.mantime:hover{color:var(--text)}
.mantime.has{border-style:solid;background:var(--surface);color:var(--text)}
.mt-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mt-quick{display:flex;gap:6px;flex-wrap:wrap}
.mt-quick button{height:30px;padding:0 12px;border-radius:999px;font-size:12.5px;font-weight:500;color:var(--muted);background:var(--surface);border:1px solid var(--outline)}
.mt-quick button:hover{color:var(--text);border-color:var(--outline-strong)}
.mt-note{display:flex;gap:8px;align-items:flex-start;font-size:12.5px;color:var(--muted);padding:10px 12px;border-radius:10px;background:var(--surface);border:1px solid var(--outline)}
.mt-note svg{width:15px;height:15px;flex:none;margin-top:1px;color:var(--accent)}
.seg3{display:flex;padding:2px;border-radius:9px;background:var(--surface2);border:1px solid var(--outline)}
.seg3 button{height:26px;padding:0 9px;border-radius:7px;font-size:12px;font-weight:500;color:var(--muted)}
.seg3 button[aria-pressed="true"]{background:var(--surface);color:var(--text);box-shadow:var(--shadow-sm)}
.seg3 .ss-progress[aria-pressed="true"]{color:var(--progress);background:var(--progress-bg);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--progress) 45%,transparent)}
.seg3 .ss-done[aria-pressed="true"]{background:linear-gradient(135deg,var(--accent),var(--accent-2));color:#fff}
.xpfloat{position:fixed;z-index:80;translate:-50% 0;font:700 13px var(--mono);color:var(--accent);pointer-events:none;text-shadow:0 1px 8px var(--accent-soft);animation:xpup 1.1s cubic-bezier(.2,.8,.3,1) forwards}
.xpfloat.neg{color:var(--faint)}
@keyframes xpup{0%{opacity:0;transform:translateY(4px) scale(.8)}15%{opacity:1;transform:translateY(-6px) scale(1.1)}100%{opacity:0;transform:translateY(-38px) scale(1)}}

/* profile */
.avatar{width:56px;height:56px;border-radius:16px;display:grid;place-items:center;font-weight:600;font-size:20px;color:#fff;background:linear-gradient(135deg,var(--accent),var(--accent-2));flex:none;box-shadow:var(--shadow)}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:12.5px;font-weight:500;color:var(--text)}
.field input{height:40px;border-radius:10px;border:1px solid var(--outline);background:var(--surface);padding:0 12px;outline:none;font-size:14px;min-width:0;width:100%;box-shadow:var(--shadow-sm);transition:border-color .15s,box-shadow .15s}
.field input:focus{border-color:var(--accent);box-shadow:0 0 0 4px var(--accent-soft)}
.field input::placeholder{color:var(--faint)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:480px){.grid2{grid-template-columns:1fr}}
.btn{height:40px;border-radius:10px;font-weight:500;font-size:14px;display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:0 16px;transition:background .15s,border-color .15s,transform .1s}
.btn:active{transform:scale(.98)}
.btn svg{width:16px;height:16px}
.btn.primary{background:var(--text);color:var(--bg);box-shadow:var(--shadow-sm)}
.btn.primary:hover{opacity:.9}
.btn.ghost{background:var(--surface);border:1px solid var(--outline);box-shadow:var(--shadow-sm)}
.btn.ghost:hover{background:var(--surface2)}
.btn.danger{color:var(--danger);background:transparent;border:1px solid color-mix(in srgb,var(--danger) 35%,transparent)}
.btn.danger:hover{background:color-mix(in srgb,var(--danger) 8%,transparent)}
.btn.full{width:100%}
.btn:disabled{opacity:.45;cursor:not-allowed}
.seg{display:flex;background:var(--surface2);border-radius:10px;padding:3px;border:1px solid var(--outline)}
.seg button{flex:1;height:32px;border-radius:7px;font-weight:500;font-size:13px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--text);box-shadow:var(--shadow-sm),0 0 0 1px var(--outline)}
/* liquid toggle */
.ltoggle{position:relative;width:54px;height:30px;border-radius:999px;flex:none;-webkit-tap-highlight-color:transparent}
/* No SVG filter and no background-image transition: both repaint on the CPU every frame in an
   Android WebView. The track colour fades by opacity and the knob moves by translate/scale only. */
.ltoggle .lt-track{position:absolute;inset:0;border-radius:inherit;background:var(--outline-strong);box-shadow:inset 0 1px 2px rgba(0,0,0,.18);overflow:hidden}
.ltoggle .lt-track::after{content:"";position:absolute;inset:0;background:linear-gradient(135deg,var(--accent),var(--accent-2));opacity:0;transition:opacity .35s ease}
.ltoggle[aria-checked="true"] .lt-track::after{opacity:1}
.ltoggle .lt-goo{position:absolute;inset:0}
.ltoggle .lt-goo i{position:absolute;border-radius:50%;background:#fff;translate:0 0;will-change:translate;
  transition:translate .45s cubic-bezier(.45,1.45,.4,1)}
.ltoggle .lt-goo .knob{top:4px;left:4px;width:22px;height:22px;box-shadow:0 1px 3px rgba(0,0,0,.28)}
.ltoggle .lt-goo .d1,.ltoggle .lt-goo .d2{display:none}
.ltoggle[aria-checked="true"] .lt-goo i{translate:24px 0}
.ltoggle.flip .lt-goo .knob{animation:lt-squash .45s cubic-bezier(.3,1.3,.5,1)}
@keyframes lt-squash{0%{scale:1}30%{scale:1.3 .82}65%{scale:.94 1.06}100%{scale:1}}
.ltoggle:active .lt-goo .knob{scale:1.12 .92}
.ltoggle .lt-icon{position:absolute;top:4px;left:4px;width:22px;height:22px;display:grid;place-items:center;pointer-events:none;
  translate:0 0;transition:translate .45s cubic-bezier(.45,1.45,.4,1)}
.ltoggle[aria-checked="true"] .lt-icon{translate:24px 0}
.ltoggle .lt-icon>span{grid-area:1/1;display:grid;transition:opacity .3s ease,rotate .5s cubic-bezier(.3,1.5,.5,1),scale .3s ease}
.ltoggle .lt-icon svg{width:13px;height:13px}
.ltoggle .i-sun{color:#D97706}
.ltoggle .i-moon{color:var(--accent);opacity:0;rotate:-90deg;scale:.6}
.ltoggle[aria-checked="true"] .i-sun{opacity:0;rotate:90deg;scale:.6}
.ltoggle[aria-checked="true"] .i-moon{opacity:1;rotate:0deg;scale:1}
.ltoggle:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
/* theme change (see swapTheme): an old-background layer and a growing circle of the new one, both
   behind the scenery and the cards; the circle moves by transform only so it stays on the GPU */
.no-tr *:not(.ltoggle *){transition:none!important}
.theme-cover{position:fixed;inset:0;z-index:0;pointer-events:none;background-attachment:fixed}
.theme-ink{position:fixed;border-radius:50%;pointer-events:none;z-index:0;will-change:transform,opacity;transform:scale(0)}
.switch{width:40px;height:24px;border-radius:999px;background:var(--outline-strong);position:relative;flex:none;transition:background .2s}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .2s}
.switch[aria-checked="true"]{background:var(--accent)}
.switch[aria-checked="true"]::after{transform:translateX(16px)}
.note{font-size:12.5px;color:var(--muted)}

/* dock */
.nav{position:fixed;left:0;right:0;bottom:0;padding:10px 20px calc(14px + env(safe-area-inset-bottom,0px));display:flex;justify-content:center;pointer-events:none;z-index:30}
/* liquid glass — adapted from the 21st.dev "Apple Tahoe" LiquidGlassButton:
   a lens-shaped displacement map bends the page at the rim (centre stays clear),
   and rim light + shading follow a fixed light source above the screen (--cos/--sin set by JS) */
.nav .dock{position:relative;width:100%;max-width:360px;height:58px;pointer-events:auto}
/* hidden while the on-screen keyboard is up, so it doesn't ride on top of the keys */
.kb-open .nav{display:none}
/* glass sheet, lens and tabs are siblings: a backdrop-filter nested inside another one only sees its parent layer, not the page */
.nav .tabs{position:absolute;inset:6px;display:flex;z-index:3}
.nav .pill{position:absolute;inset:0;isolation:isolate;border-radius:999px;
  --cos:0;--sin:.85;--rim-gradient:linear-gradient(180deg,rgba(255,255,255,.7),rgba(255,255,255,.08) 45%,rgba(255,255,255,.3));
  background:var(--glass-tint);
  -webkit-backdrop-filter:blur(2px) saturate(180%);backdrop-filter:blur(2px) saturate(180%)}
.svg-glass .nav .pill{backdrop-filter:blur(1.4px) url("#lg-dock") saturate(190%) brightness(var(--dock-bright))}
.nav .ind{position:absolute;top:6px;bottom:6px;left:6px;width:calc((100% - 12px)/3);border-radius:999px;z-index:0;
  --cos:0;--sin:.85;--rim-gradient:linear-gradient(180deg,rgba(255,255,255,.8),rgba(255,255,255,.1) 45%,rgba(255,255,255,.35));
  background:var(--lens-tint);
  background-image:none;
  transition:translate .42s cubic-bezier(.32,1.16,.4,1),scale .3s cubic-bezier(.3,1.3,.4,1)}
.nav .ind::before{content:"";position:absolute;inset:0;border-radius:inherit;overflow:hidden;z-index:-1;
  -webkit-backdrop-filter:blur(1px) saturate(180%);backdrop-filter:blur(1px) saturate(180%)}
.svg-glass .nav .ind::before{backdrop-filter:url("#lg-lens") saturate(210%) brightness(var(--lens-bright)) contrast(1.04)}
.nav .dock.lg-reset .pill,.nav .dock.lg-reset .ind::before{backdrop-filter:none!important}
/* bevel: light-facing highlights, shaded far side, soft drop shadow away from the light */
.nav .pill,.nav .ind{box-shadow:
  inset 0 0 0 1px var(--glass-hair),
  inset calc(var(--cos) * 1.8px) calc(var(--sin) * 3px) 0 -2px rgba(255,255,255,.35),
  inset calc(var(--cos) * -2px) calc(var(--sin) * -2px) 0 -2px rgba(255,255,255,.2),
  inset calc(var(--cos) * -3px) calc(var(--sin) * -8px) 1px -6px rgba(255,255,255,.12),
  inset calc(var(--cos) * -.3px) calc(var(--sin) * -1px) 4px 0 rgba(0,0,0,.12),
  inset calc(var(--cos) * -1.5px) calc(var(--sin) * 2.5px) 0 -2px rgba(0,0,0,.2),
  inset 0 calc(var(--sin) * 3px) 4px -2px rgba(0,0,0,.2),
  inset calc(var(--cos) * 2px) calc(var(--sin) * -6.5px) 1px -4px rgba(0,0,0,.1),
  calc(var(--cos) * 4px) calc(var(--sin) * 4px) 10px 0 rgba(0,0,0,.15),
  calc(var(--cos) * 9px) calc(var(--sin) * 9px) 18px 0 rgba(0,0,0,.1)}
/* outer rim: conic gradient, brightest where the edge faces the light */
.nav .pill::before,.nav .ind::after{content:"";position:absolute;inset:0;border-radius:inherit;padding:1px;pointer-events:none;z-index:2;
  background:var(--rim-gradient);
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;
  mask:linear-gradient(#000 0 0) content-box exclude,linear-gradient(#000 0 0);opacity:.6}
.nav .ind.moving{scale:1.06 .96}
/* press: the bubble lifts as soon as a finger touches the bar, and stays up while it travels.
   The lift is kept small in width so the glass never grows past the ends of the bar. */
.nav .dock.pressing .ind{scale:1.1 1.32}
.nav button{flex:1;position:relative;z-index:1;display:flex;align-items:center;justify-content:center;gap:7px;font-weight:500;font-size:15px;color:var(--muted);border-radius:999px;text-shadow:0 1px 2px var(--glass-ts);transition:color .2s,transform .3s cubic-bezier(.3,1.5,.5,1)}
@media (hover:hover){.nav button:hover{color:var(--text);transform:scale(1.05)}}
.nav button[aria-current="page"]{color:var(--text);font-weight:600}
.nav button svg{filter:drop-shadow(0 1px 1px var(--glass-ts))}
/* drag: the glass lifts, tracks the finger and stretches with speed; release springs it onto a tab */
.nav .dock{touch-action:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
.nav .dock.dragging .ind{scale:var(--sx,1.1) var(--sy,1.32);
  transition:scale .25s cubic-bezier(.2,.9,.3,1.15)}
.nav .dock.dragging button{transform:none;cursor:grabbing}
.nav .dock.dragging button[aria-current="page"]:not(.hot){color:var(--muted);font-weight:500}
.nav button.hot{color:var(--text);font-weight:600}
.nav svg{width:20px;height:20px}
.nav button{white-space:nowrap}
/* very narrow phones: step the labels back down so "Work Log" still fits its third of the bar */
@media (max-width:350px){.nav button{font-size:13px;gap:5px}.nav svg{width:18px;height:18px}}

/* sheet */
.scrim{position:fixed;inset:0;background:var(--scrim);backdrop-filter:blur(4px);z-index:50;display:flex;align-items:flex-end;justify-content:center;animation:fade .2s}
.sheet{background:var(--surface);width:100%;max-width:520px;max-height:88%;overflow:auto;border:1px solid var(--outline);border-bottom:0;border-radius:20px 20px 0 0;padding:10px 20px calc(22px + env(safe-area-inset-bottom,0px));box-shadow:var(--shadow-lg);animation:up .28s cubic-bezier(.2,.9,.3,1)}
@media (min-width:640px){.scrim{align-items:center}.sheet{border-radius:20px;border-bottom:1px solid var(--outline);padding-bottom:22px}.sheet .grab{display:none}}
.sheet .grab{width:36px;height:4px;border-radius:4px;background:var(--outline-strong);margin:0 auto 12px}
.sheet h2{margin:0;font-size:18px;font-weight:600;letter-spacing:-.02em}
.opt{display:flex;gap:12px;align-items:flex-start;padding:11px 13px;border-radius:12px;border:1px solid var(--outline);background:var(--surface);text-align:left;width:100%;transition:border-color .15s,box-shadow .15s}
.opt:hover{border-color:var(--outline-strong)}
.opt[aria-checked="true"]{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.opt .radio{width:16px;height:16px;border-radius:50%;border:1.5px solid var(--outline-strong);flex:none;margin-top:2px;display:grid;place-items:center}
.opt[aria-checked="true"] .radio{border-color:var(--accent);background:var(--accent)}
.opt[aria-checked="true"] .radio::after{content:"";width:6px;height:6px;border-radius:50%;background:#fff}
.opt b{display:block;font-size:14px;font-weight:500}
.opt span{font-size:12.5px;color:var(--muted)}
.dows{display:flex;gap:6px;flex-wrap:wrap}
.dows button{width:44px;height:36px;border-radius:9px;font-weight:500;font-size:12.5px;background:var(--surface);border:1px solid var(--outline);color:var(--muted)}
.dows button[aria-pressed="true"]{background:var(--text);color:var(--bg);border-color:var(--text)}
.swatches{display:flex;gap:8px;flex-wrap:wrap}
.swatches button{width:28px;height:28px;border-radius:8px;background:var(--c);box-shadow:inset 0 0 0 1px rgba(0,0,0,.08)}
.swatches button[aria-pressed="true"]{box-shadow:0 0 0 2px var(--surface),0 0 0 4px var(--c)}
.check{display:flex;gap:10px;align-items:center;font-size:13px;font-weight:500}
.check input{width:16px;height:16px;accent-color:var(--accent)}
.export{width:100%;min-height:140px;font-family:var(--mono);font-size:11.5px;overflow:auto;resize:vertical}
@keyframes fade{from{opacity:0}}
/* sign-in page */
.login{position:fixed;inset:0;z-index:1000;overflow:auto;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:calc(28px + env(safe-area-inset-top,0px)) 20px calc(28px + env(safe-area-inset-bottom,0px));animation:fade .3s ease-out}
.login::before{content:"";position:fixed;inset:-20% -20% auto;height:70%;background:radial-gradient(60% 60% at 30% 20%,color-mix(in srgb,var(--accent) 34%,transparent),transparent 70%),radial-gradient(50% 50% at 80% 10%,color-mix(in srgb,var(--accent-2) 26%,transparent),transparent 70%);pointer-events:none}
.login.out{animation:loginOut .35s ease-in forwards}
@keyframes loginOut{to{opacity:0;transform:scale(1.03)}}
.lg-card{position:relative;width:100%;max-width:400px;display:flex;flex-direction:column;align-items:center;text-align:center;gap:18px}
.lg-logo{width:76px;height:76px;border-radius:22px;display:grid;place-items:center;background:linear-gradient(135deg,var(--accent-2),var(--accent));box-shadow:0 18px 40px -12px color-mix(in srgb,var(--accent) 70%,transparent);animation:lgpop .7s cubic-bezier(.3,1.6,.5,1) both}
.lg-logo svg{width:42px;height:42px}
@keyframes lgpop{from{transform:scale(.4) rotate(-12deg);opacity:0}}
.lg-card h1{margin:4px 0 0;font-size:30px;font-weight:700;letter-spacing:-.03em}
.lg-sub{margin:-8px 0 0;color:var(--muted);font-size:14.5px;line-height:1.5;max-width:320px}
.lg-feats{width:100%;display:grid;gap:8px;margin:6px 0}
.lg-feat{display:flex;align-items:center;gap:12px;text-align:left;padding:12px 14px;border-radius:14px;background:var(--surface);border:1px solid var(--outline);animation:pcrow .5s cubic-bezier(.2,.8,.3,1) both;animation-delay:calc(.15s + var(--i)*.07s)}
.lg-feat i{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;flex:none;background:var(--accent-soft);color:var(--accent)}
.lg-feat i svg{width:18px;height:18px}
.lg-feat b{display:block;font-size:13.5px;font-weight:600}
.lg-feat span{font-size:12.5px;color:var(--muted)}
.gbtn{width:100%;height:50px;border-radius:14px;display:flex;align-items:center;justify-content:center;gap:12px;font-size:15px;font-weight:600;background:#fff;color:#1F1F1F;border:1px solid #DADCE0;box-shadow:0 1px 2px rgba(0,0,0,.08),0 6px 18px -8px rgba(0,0,0,.25);transition:transform .15s,box-shadow .15s}
.gbtn:hover{box-shadow:0 1px 2px rgba(0,0,0,.08),0 10px 24px -8px rgba(0,0,0,.3)}
.gbtn:active{transform:scale(.98)}
.gbtn svg{width:20px;height:20px}
.gbtn[disabled]{opacity:.6}
.gbtn .spin{width:18px;height:18px;border-radius:50%;border:2px solid #DADCE0;border-top-color:#4285F4;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.lg-skip{font-size:14px;font-weight:500;color:var(--muted);padding:8px 14px;border-radius:10px}
.lg-skip:hover{color:var(--text);background:var(--surface)}
.lg-fine{font-size:11.5px;color:var(--faint);max-width:330px;line-height:1.5;margin:0}
.lg-fine a{color:inherit;text-decoration:underline}
/* account card on Profile */
.acct{display:flex;align-items:center;gap:12px}
.acct-pic{width:44px;height:44px;border-radius:50%;flex:none;overflow:hidden;display:grid;place-items:center;font-weight:600;color:#fff;background:linear-gradient(135deg,var(--accent),var(--accent-2))}
.acct-pic img{width:100%;height:100%;object-fit:cover}
.acct-who{min-width:0;flex:1}
.acct-who b{display:block;font-size:14.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.acct-who span{display:block;font-size:12.5px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sync-st{display:inline-flex;align-items:center;gap:7px;font-size:12.5px;color:var(--muted)}
.sync-st i{width:8px;height:8px;border-radius:50%;background:var(--faint);flex:none}
.sync-st.ok i{background:#22C55E}
.sync-st.busy i{background:var(--accent);animation:live 1s ease-in-out infinite}
.sync-st.err i{background:var(--danger)}
@keyframes up{from{transform:translateY(24px);opacity:0}}

.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--surface);color:var(--text);border:1px solid var(--outline);padding:10px 10px 10px 14px;border-radius:12px;font-weight:500;font-size:13px;display:flex;gap:14px;align-items:center;z-index:60;box-shadow:var(--shadow-lg);max-width:calc(100% - 32px);animation:up .2s}
.toast button{color:var(--text);font-weight:500;font-size:12.5px;padding:4px 10px;border-radius:8px;border:1px solid var(--outline);background:var(--surface2)}

.confetti{position:fixed;inset:0;pointer-events:none;z-index:70}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ===== overhaul: home hero, richer month tiles, work-log header, expanded day, photos, profile card ===== */
body{background-image:radial-gradient(70% 45% at 88% -8%,var(--accent-soft),transparent 70%),radial-gradient(var(--dot) 1px,transparent 1px);background-size:auto,22px 22px}
.hero{position:relative;overflow:hidden;border-radius:24px;padding:18px;color:#fff;background:radial-gradient(90% 120% at 100% 0%,rgba(255,255,255,.24),transparent 55%),linear-gradient(135deg,var(--g1),var(--g2) 55%,var(--g3));box-shadow:0 18px 40px -18px color-mix(in srgb,var(--g2) 75%,transparent),inset 0 1px 0 rgba(255,255,255,.25)}
.hero-top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.hero-eyebrow{font-size:12px;font-weight:500;opacity:.8}

.hero-lv{display:inline-flex;flex:none;align-items:center;gap:6px;padding:4px 10px;font-family:var(--ui);border-radius:99px;background:rgba(255,255,255,.18);font-size:12px;font-weight:600;white-space:nowrap}
.hero-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:16px}

.hero-xp{height:6px;border-radius:9px;background:rgba(255,255,255,.22);margin-top:8px;overflow:hidden}

.hero-foot{display:flex;justify-content:space-between;font-size:11.5px;opacity:.82;margin-top:6px;font-family:var(--mono)}
.mcard{border-radius:20px;background:linear-gradient(180deg,color-mix(in srgb,var(--accent) calc(var(--p,0)*12%),transparent),transparent 58%),var(--surface)}
.mini{gap:3px}.mini i{border-radius:4px}
.mc-bar{height:4px;border-radius:9px;background:var(--surface2);overflow:hidden}
.mc-bar i{display:block;height:100%;border-radius:inherit;background:linear-gradient(90deg,var(--accent),var(--accent-2))}
.me-btn{width:40px;height:40px;border-radius:50%;flex:none;overflow:hidden;display:grid;place-items:center;font-weight:600;font-size:14px;color:#fff;background:linear-gradient(135deg,var(--accent),var(--accent-2));border:2px solid var(--surface);box-shadow:0 0 0 1px var(--outline),var(--shadow-sm);transition:transform .25s cubic-bezier(.3,1.5,.5,1),box-shadow .2s}

<script>
/* Liquid glass engine for the bottom nav (vanilla port of the Tahoe LiquidGlassViewport idea) */
(() => {
  const ua = navigator.userAgent;
  const ios = /iPhone|iPad|iPod/.test(ua) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
  // SVG filters inside backdrop-filter only render in Chromium; everyone else gets the blur fallback
  const svgOK = /Chrome|Chromium|Edg\//.test(ua) && !/Firefox|FxiOS|CriOS/.test(ua) && !ios;
  const pill = document.getElementById("navpill"), ind = document.getElementById("ind");
  if (!pill || !ind) return;
  const BINS = 24, POW = 1.5, MAX_SLOPE = .8;

  // Glass settings. `bezel` is how far in from the rim the surface curves (px).
  // `depth` is the largest pixel shift at the rim. It is capped so the shift never changes
  // faster than MAX_SLOPE px per px. Past 1 the image folds over and text shows mirrored.
  const DOCK = { bezel: 14, depth: 6 };           // thin sheet: gentle rim, flat clear middle
  const LENS = { bezel: null, depth: null };      // highlight: curved edge to edge (sized from its height)

  // Stadium-shaped convex lens. Each pixel inside the bezel samples from further in, so the
  // page compresses toward the rim like real curved glass. The middle stays untouched.
  // Profile: shift = depth * (1 - e/bezel)^POW, where e = distance in from the rim.
  function lensMap(w, h, bezel) {
    w = Math.max(1, Math.round(w)); h = Math.max(1, Math.round(h));
    const c = document.createElement("canvas"); c.width = w; c.height = h;
    const ctx = c.getContext("2d"), img = ctx.createImageData(w, h), d = img.data, r = h / 2;
    for (let j = 0; j < h; j++) for (let i = 0; i < w; i++) {
      const px = i + .5, py = j + .5, cx = Math.min(Math.max(px, r), w - r);
      const vx = px - cx, vy = py - r, dist = Math.hypot(vx, vy), e = r - dist;
      let R = 128, G = 128;
      if (e > 0 && e < bezel && dist > 0) {
        const m = Math.pow(1 - e / bezel, POW); // 1 at the rim → 0 where the glass goes flat
        R = 128 - (vx / dist) * m * 127; G = 128 - (vy / dist) * m * 127;
      }
      const k = (j * w + i) * 4; d[k] = R; d[k + 1] = G; d[k + 2] = 128; d[k + 3] = 255;
    }
    ctx.putImageData(img, 0, 0);
    return c.toDataURL("image/png");
  }
  function sizeFilter(id, el, bezel, depth) {
    const w = el.offsetWidth, h = el.offsetHeight; if (!w || !h) return false;
    depth = Math.min(depth, (MAX_SLOPE * bezel) / POW);   // never fold
    const key = `${w}x${h}:${bezel}:${depth}`; if (el._lensKey === key) return false; el._lensKey = key;
    const f = document.getElementById(id), im = f.querySelector("feImage");
    for (const n of [f, im]) { n.setAttribute("width", w); n.setAttribute("height", h); }
    im.setAttribute("href", lensMap(w, h, bezel));
    // feDisplacementMap shifts by scale × (channel − 0.5), so scale = 2 × depth
    f.querySelectorAll("feDisplacementMap").forEach(dm => dm.setAttribute("scale", (2 * depth * +dm.dataset.k).toFixed(2)));
    return true;
  }
  // Fixed light above the top-centre of the screen: rim glow and shading turn to face it
  function light(el) {
    const r = el.getBoundingClientRect();
    const lx = innerWidth / 2 - (r.left + r.width / 2), ly = -innerHeight * .2 - (r.top + r.height / 2);
    const len = Math.hypot(lx, ly) || 1, ux = lx / len, uy = ly / len, I = 1.1;
    el.style.setProperty("--cos", (-ux * I).toFixed(3));
    el.style.setProperty("--sin", (-uy * I).toFixed(3));
    const from = Math.atan2(ux, -uy) * 180 / Math.PI; // CSS conic: 0deg is up, clockwise
    const stops = [];
    for (let b = 0; b <= BINS; b++) {
      const th = (b / BINS) * 2 * Math.PI;
      const face = Math.max(0, Math.cos(th)) ** 2, back = .45 * Math.max(0, -Math.cos(th)) ** 3;
      stops.push(`rgba(255,255,255,${(0.1 + 0.9 * Math.min(1, face + back)).toFixed(3)}) ${((b / BINS) * 360).toFixed(1)}deg`);
    }
    el.style.setProperty("--rim-gradient", `conic-gradient(from ${from.toFixed(1)}deg at 50% 50%, ${stops.join(",")})`);
  }
  function update() {
    if (svgOK) {
      const lensBezel = ind.offsetHeight / 2 - 1;
      let changed = sizeFilter("lg-dock", pill, DOCK.bezel, DOCK.depth);
      changed = sizeFilter("lg-lens", ind, LENS.bezel ?? lensBezel, LENS.depth ?? lensBezel) || changed;
      if (changed) { pill.parentElement.classList.add("lg-reset"); void pill.offsetWidth; pill.parentElement.classList.remove("lg-reset"); }
      // switch the lens on only once both maps exist (an empty map shifts the whole backdrop)
      if (pill._lensKey && ind._lensKey) document.documentElement.classList.add("svg-glass");
    }
    light(pill); light(ind);
  }
  // follow the highlight while it slides between tabs
  let until = 0, raf = 0;
  function follow(ms) {
    until = Math.max(until, performance.now() + ms);
    if (raf) return;
    const step = () => { light(ind); if (performance.now() < until) raf = requestAnimationFrame(step); else { raf = 0; update(); } };
    raf = requestAnimationFrame(step);
  }
  // only react when the highlight actually moves — light() itself writes to ind.style
  let lastPos = "";
  new MutationObserver(() => {
    const pos = ind.style.translate + "|" + ind.className;
    if (pos !== lastPos) { lastPos = pos; follow(650); }
  }).observe(ind, { attributes: true, attributeFilter: ["style", "class"] });
  addEventListener("resize", () => { update(); follow(200); });

  // ---- iOS-style drag: press the bar and slide the glass between tabs ----
  const wide = matchMedia("(min-width:1100px)"); // desktop: the dock becomes a sidebar with plain buttons
  const dock = pill.parentElement, tabs = [...dock.querySelectorAll(".tabs button")];
  let drag = null, suppressClick = false, pressT = 0, liftT = 0, dragRaf = 0;
  const INSET = 6, LIFT_X = 1.1, LIFT_Y = 1.32, MAX_STRETCH = .06; // lifted bubble: 1.32× tall pokes ~4px past the 58px bar
  const buzz = () => { try { if (navigator.vibrate && (!navigator.userActivation || navigator.userActivation.hasBeenActive)) navigator.vibrate(6); } catch (_) {} };
  const current = () => Math.max(0, tabs.findIndex(b => b.getAttribute("aria-current") === "page"));

  // The glass eases toward the finger every frame instead of jumping to it, so the motion stays fluid
  // even when pointer events arrive unevenly. The lag also drives the stretch along the direction of travel.
  function chase() {
    if (!drag || !drag.active) { dragRaf = 0; return; }
    const gap = drag.tx - drag.cur;
    drag.cur += gap * .3;
    if (Math.abs(gap) < .05) drag.cur = drag.tx;
    const s = Math.min(Math.abs(gap) / 90, MAX_STRETCH);
    ind.style.setProperty("--sx", (LIFT_X + s).toFixed(3));
    ind.style.setProperty("--sy", (LIFT_Y - s * 1.2).toFixed(3));
    ind.style.translate = `${drag.cur.toFixed(2)}px`;
    dragRaf = requestAnimationFrame(chase);
  }

  dock.addEventListener("pointerdown", e => {
    if (e.button > 0 || (wide.matches && !window.WorkLogApp)) return;
    clearTimeout(liftT); pressT = performance.now(); dock.classList.add("pressing");
    drag = { id: e.pointerId, x0: e.clientX, active: false, r: dock.getBoundingClientRect(), w: ind.offsetWidth,
             hot: current(), cur: 0, tx: 0 };
  });
  dock.addEventListener("pointermove", e => {
    if (!drag || e.pointerId !== drag.id) return;
    if (!drag.active) {
      if (Math.abs(e.clientX - drag.x0) < 6) return;          // still a tap
      drag.active = true;
      drag.cur = drag.tx = drag.hot * drag.w;                 // start from where the glass rests
      try { dock.setPointerCapture(e.pointerId); } catch (_) {}
      dock.classList.add("dragging");
      dragRaf = requestAnimationFrame(chase);
    }
    const { r, w } = drag, max = w * (tabs.length - 1);
    // keep the whole stretched glass inside the bar: it can slide to either end but never past it
    const room = Math.max(0, (w * (LIFT_X + MAX_STRETCH - 1)) / 2 - INSET + 1);
    drag.tx = Math.min(Math.max(e.clientX - r.left - INSET - w / 2, room), max - room);
    const hot = Math.round(drag.tx / w);
    if (hot !== drag.hot) { drag.hot = hot; buzz(); }
    tabs.forEach((b, i) => b.classList.toggle("hot", i === hot));
  });
  function endDrag(e) {
    if (!drag || e.pointerId !== drag.id) return;
    const d = drag; drag = null;
    cancelAnimationFrame(dragRaf); dragRaf = 0;
    // keep it lifted long enough to see, and through the slide to the new tab
    clearTimeout(liftT); liftT = setTimeout(() => dock.classList.remove("pressing"), Math.max(220, 380 - (performance.now() - pressT)));
    if (!d.active) return;                                    // plain tap: let the click through
    dock.classList.remove("dragging");
    ind.style.removeProperty("--sx"); ind.style.removeProperty("--sy");
    tabs.forEach(b => b.classList.remove("hot"));
    const target = tabs[d.hot];
    if (target.getAttribute("aria-current") === "page") ind.style.translate = `${d.hot * 100}%`; // spring back
    else target.click();                                     // app switches tab and springs the glass into place
    suppressClick = true; setTimeout(() => (suppressClick = false), 80); // swallow the click the release would fire
  }
  dock.addEventListener("pointerup", endDrag);
  dock.addEventListener("pointercancel", endDrag);
  dock.addEventListener("click", e => { if (suppressClick) { e.stopPropagation(); e.preventDefault(); } }, true);
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(update);
  requestAnimationFrame(update);
})();
</script>

// shrink a picked photo before it goes into storage: keeps the app light and inside the browser's storage limit
function shrinkImage(file,max,quality,square){
  return new Promise((res,rej)=>{
    const url=URL.createObjectURL(file),img=new Image();
    img.onload=()=>{
      let sw=img.naturalWidth,sh=img.naturalHeight,sx=0,sy=0,w,h;
      if(square){const s=Math.min(sw,sh);sx=(sw-s)/2;sy=(sh-s)/2;sw=sh=s;w=h=Math.min(max,s)}
      else{const k=Math.min(1,max/Math.max(sw,sh));w=Math.round(sw*k);h=Math.round(sh*k)}
      const c=document.createElement("canvas");c.width=w;c.height=h;const x=c.getContext("2d");x.fillStyle="#fff";x.fillRect(0,0,w,h);x.drawImage(img,sx,sy,sw,sh,0,0,w,h);
      URL.revokeObjectURL(url);res(c.toDataURL("image/jpeg",quality))};
    img.onerror=()=>{URL.revokeObjectURL(url);rej(new Error("bad image"))};
    img.src=url;

function validBackup(d){return !!d&&typeof d.entries==="object"&&!!d.entries&&Array.isArray(d.tags)}

function hasData(d){return !!d&&(Object.values(d.entries||{}).some(r=>r&&Object.keys(r).some(k=>k!=="off"))||(d.tags||[]).length>0||!!(d.profile&&(d.profile.name||d.profile.photo)))}

/* ---------- automatic backup ---------- */
// After every change a full copy goes somewhere that outlives the app's own storage:
//  · Android app: Documents/WorkLog on the phone (stays even if the app is deleted), plus a copy
//    Android's backup brings back when the app is installed again (read at start-up, above)
//  · browser: a file picked once (Chrome/Edge on a computer); elsewhere, a download button
const BK="worklog.bk",FSA=!window.WorkLogApp&&"showSaveFilePicker" in window;
const bkInfo=()=>{try{return JSON.parse(localStorage.getItem(BK))||{}}catch(e){return{}}};

let bkT=null,bkFile=null,bkHandle=null;
// the running timer's time so far goes into the copy, so a restore never loses it
function backupText(){let entries=S.entries;
  if(S.timer){const r=S.entries[S.timer.id]||{};entries={...S.entries,[S.timer.id]:{...r,secs:(r.secs||0)+(Date.now()-S.timer.start)/1000}}}
  return JSON.stringify({...S,entries,timer:null,backupAt:new Date().toISOString()})}
function scheduleBackup(){if(S.abk===false)return;clearTimeout(bkT);bkT=setTimeout(runBackup,1500)}
// force: also write an empty log (after "Erase all data"); otherwise an empty app never replaces a good backup
async function runBackup(force){bkT=null;
  if(!force&&!hasData(S))return false;
  const text=backupText(),A=window.WorkLogApp;
  if(A&&A.backup){try{A.backup(text);return true}catch(e){return false}} // the app answers through window.__bkDone
  if(!bkFile)return false;
  try{const w=await bkFile.createWritable();await w.write(text);await w.close();bkSet({at:Date.now(),ok:1,where:bkFile.name});refreshBk();return true}
  catch(e){bkFile=null;bkSet({ok:0});refreshBk();return false}
}
window.__bkDone=(ok,where)=>{bkSet(ok?{at:Date.now(),ok:1,where}:{ok:0});refreshBk()};

// browser backup file: the handle is kept in IndexedDB; the browser may ask again for permission after a restart

  const man=r.man||0,secs=tsecs+man;

    has:!!((r.tasks||"").trim()||(r.notes||"").trim()||secs>0||st==="done"||photos.length),future:id>TODAY};

  const pend=work.filter(d=>d.status==="pending").length;

function streaks(){
  // current: walk back from today; days off don't break it; an empty today doesn't break it yet
  let cur=0;const c=new Date(TY,TM-1,TD);
  for(let i=0;i<730;i++){const x=day(c.getFullYear(),c.getMonth()+1,c.getDate());
    if(x.has)cur++;else if(!(x.off||i===0))break;c.setDate(c.getDate()-1)}
  const first=Object.keys(S.entries).sort(cmpId)[0],[fy,fm,fd]=first?parseId(first):[TY,1,1];
  let best=0,run=0;const s=new Date(fy,fm-1,fd);
  while(s<=now){const x=day(s.getFullYear(),s.getMonth()+1,s.getDate());
    if(x.has){run++;best=Math.max(best,run)}else if(!x.off&&idOf(s.getFullYear(),s.getMonth()+1,s.getDate())!==TODAY)run=0;s.setDate(s.getDate()+1)}

function weekTrend(y,m){

  const mon=new Date(anchor);mon.setDate(mon.getDate()-((mon.getDay()+6)%7)-35);
  const out=[];
  for(let w=0;w<6;w++){let done=0,pend=0,label="";
    for(let k=0;k<7;k++){const t=new Date(mon);t.setDate(mon.getDate()+w*7+k);
      const x=day(t.getFullYear(),t.getMonth()+1,t.getDate());
      if(k===0)label=`${MSHORT[t.getMonth()]} ${t.getDate()}`;
      if(x.status==="done")done++;else if(!x.off&&!x.future&&x.status!=="done")pend++}
    out.push({label,done,pend})}

}

const THEME_GROW=600;
function swapTheme(from){
  const apply=()=>{applyTheme();
    const icon=document.getElementById("themeIcon"),note=document.getElementById("themeNote");
    if(icon)icon.innerHTML=isDark()?ic.moon:ic.sun;if(note)note.textContent=themeNote()};
  // a quick second tap finishes the running swap first
  if(swapTheme._end)swapTheme._end();
  if(!Element.prototype.animate||matchMedia("(prefers-reduced-motion: reduce)").matches){apply();return}
  const b=from&&from.getBoundingClientRect(),w=innerWidth,h=innerHeight,
    x=b?b.left+b.width/2:w/2,y=b?b.top+b.height/2:h/2,R=Math.ceil(Math.hypot(Math.max(x,w-x),Math.max(y,h-y)))+2;

  // Two plain layers sit behind the scenery and the cards: a copy of the old page background, and a
  // circle of the new one growing from the switch. The page restyles in the same frame the circle
  // starts, so the cards, text and circle always agree; after that heavy frame the circle glides on
  // the GPU (transform only).
  const bs=getComputedStyle(document.body),cover=document.createElement("div"),ink=document.createElement("div");

      // the real new background (with its dots and glow) is under the circle now; melt into it
      cover.remove();
      ink.animate([{transform:`scale(${k})`,opacity:1},{transform:`scale(${k})`,opacity:0}],{duration:240,easing:"ease-out",fill:"forwards"}).finished.then(end,end);
    },end);
}

const TITLES=["Starter","Rookie","Builder","Achiever","Pro","Expert","Master","Legend"];

const dayXP=x=>(x.status==="done"?20:x.status==="progress"?5:0)+(x.tasks.trim()?5:0)+(x.notes.trim()?2:0)+Math.round(Math.min(x.tsecs,36000)/3600*4);

function tier(n){
  const i=n<=0?0:n<3?1:n<7?2:n<14?3:4,T=[["ember","Start a streak"],["warm","Warming up"],["roll","On a roll"],["fire","On fire"],["max","Unstoppable"]][i];
  const c=i?theme().fl[i-1]:["#71717A","#A1A1AA","#D4D4D8"];

const mondayOf=(y,m,d)=>{const t=new Date(y,m-1,d);t.setDate(t.getDate()-((t.getDay()+6)%7));return t};
function perfectWeeks(){
  // Mon–Sun weeks (up to this week) where every working day so far is done — at least 3 of them
  const ids=Object.keys(S.entries).sort(cmpId);if(!ids.length)return 0;
  const [y0,m0,d0]=parseId(ids[0]);let w=mondayOf(y0,m0,d0),n=0;
  while(w<=now){let work=0,done=0;
    for(let i=0;i<7;i++){const t=new Date(w);t.setDate(w.getDate()+i);if(t>now)break;const x=day(t.getFullYear(),t.getMonth()+1,t.getDate());if(isWork(x)){work++;if(x.status==="done")done++}}
    if(work>=3&&done===work)n++;w.setDate(w.getDate()+7)}

}

  const st=streaks();let xp=0,doneDays=0,deep=0,monthH={};const tags=new Set();

    xp+=dayXP(x);if(x.status==="done")doneDays++;if(x.tsecs>=4*3600)deep++;if(x.tag)tags.add(x.tag.id);

}

function yearActivity(){
  // days logged per month, per year — from stored entries only (cheap)
  const act={};
  for(const [id,r] of Object.entries(S.entries)){
    if(!((r.tasks||"").trim()||(r.notes||"").trim()||(r.secs||0)>0||(r.man||0)>0||r.status==="done"||(r.photos&&r.photos.length)))continue;
    const y=+id.slice(0,4),m=+id.slice(5,7);(act[y]||(act[y]=Array(12).fill(0)))[m-1]++}
  return act;
}

function scheduleSheet(y,m){
  const cur=schedOf(y,m);let off=[...cur.off];
  const presets=[["WEEKENDS","Weekends off","Saturday and Sunday off — 5-day week",[6,7]],["SUNDAYS","Sundays off","Monday to Saturday working — 6-day week",[7]],["NONE","No days off","All 7 days are working days",[]],["CUSTOM","Custom","Pick the days below",null]];
  const match=p=>p[3]&&p[3].length===off.length&&p[3].every(x=>off.includes(x));
  let preset=(presets.find(match)||presets[3])[0];
  sheet(`<div class="stack">
    <div class="row between"><div><h2>Work schedule</h2><div class="note" style="color:var(--primary);font-weight:700">${MONTHS[m-1]} ${y}</div></div><button class="icon-btn" data-close aria-label="Close">${ic.x}</button></div>
    <div class="stack" style="gap:8px" id="presets"></div>
    <div><div class="eyebrow" style="margin-bottom:8px">Days off</div><div class="dows" id="dows"></div></div>
    <label class="check"><input type="checkbox" id="asdef" checked> Also use for months I haven't set up</label>
    <p class="note" style="margin:0">Your tasks, notes and timers are kept. Only which days count as days off changes.</p>
    <button class="btn primary full" id="apply">Save schedule</button></div>`,(el,close)=>{
    const draw=()=>{
      el.querySelector("#presets").innerHTML=presets.map(p=>`<button class="opt" role="radio" aria-checked="${preset===p[0]}" data-p="${p[0]}"><span class="radio"></span><span><b>${p[1]}</b><span>${p[2]}</span></span></button>`).join("");
      el.querySelector("#dows").innerHTML=DOW.map((d,i)=>`<button aria-pressed="${off.includes(i+1)}" data-d="${i+1}" aria-label="${DOWFULL[i]} ${off.includes(i+1)?"off":"working"}">${d}</button>`).join("");
    };draw();
    el.addEventListener("click",e=>{const p=e.target.closest("[data-p]"),d=e.target.closest("[data-d]");
      if(p){preset=p.dataset.p;const pr=presets.find(x=>x[0]===preset);if(pr[3])off=[...pr[3]];draw()}
      if(d){const n=+d.dataset.d;off=off.includes(n)?off.filter(x=>x!==n):[...off,n].sort();preset=(presets.find(match)||presets[3])[0];draw()}});
    el.querySelector("#apply").onclick=()=>{S.schedules[`${y}-${m}`]={preset,off};if(el.querySelector("#asdef").checked)S.defaultOff=off;save();close();render();toast(`Schedule saved for ${MONTHS[m-1]}`)};
  });
}

/* ---------- actions ---------- */
function stopTimer(){if(!S.timer)return;const r=raw(S.timer.id);r.secs=(r.secs||0)+(Date.now()-S.timer.start)/1000;const id=S.timer.id;S.timer=null;return id}
function toggleTimer(id){
  const was=S.timer&&S.timer.id;const stopped=stopTimer();
  if(was!==id){S.timer={id,start:Date.now()};const r=raw(id),[y,m,d]=parseId(id);if(day(y,m,d).status!=="done")r.status="progress";delete r.auto}
  save();if(stopped&&stopped!==id)refreshCard(stopped);refreshCard(id);refreshQuestSoon();refreshHeader();
}
// time worked without the timer: counts toward the day's hours, earns no XP
function manualSheet(id){
  const [y,m,d]=parseId(id),x=day(y,m,d),t=Math.round(x.man/60);
  sheet(`<div class="stack">
    <div class="row between"><h2>Add time by hand</h2><button class="icon-btn" data-close aria-label="Close">${ic.x}</button></div>
    <p class="note" style="margin:0">${DOWFULL[x.dow-1]}, ${x.d} ${MONTHS[x.m-1]}${x.tsecs>=60?` · timer: ${fmtDur(x.tsecs)}`:""}</p>
    <div class="mt-grid">
      <div class="field"><label for="mt-h">Hours</label><input id="mt-h" type="number" inputmode="numeric" min="0" max="24" step="1" value="${Math.floor(t/60)||""}" placeholder="0"></div>
      <div class="field"><label for="mt-m">Minutes</label><input id="mt-m" type="number" inputmode="numeric" min="0" max="59" step="5" value="${t%60||""}" placeholder="0"></div>
    </div>
    <div class="mt-quick">${[[30,"+30m"],[60,"+1h"],[120,"+2h"],[240,"+4h"],[480,"+8h"]].map(([v,l])=>`<button data-add="${v}">${l}</button>`).join("")}</div>
    <div class="mt-note">${ic.spark}<span>Hand-entered time counts toward your hours and insights, but <b>doesn't earn XP</b>. Use the timer to earn XP for focus time.</span></div>
    <div class="grid2">${x.man?`<button class="btn danger" id="mt-rm">${ic.trash}Remove</button>`:`<button class="btn ghost" data-close>Cancel</button>`}<button class="btn primary" id="mt-ok">${ic.check}Save time</button></div>
  </div>`,(el,close)=>{
    const H=el.querySelector("#mt-h"),M=el.querySelector("#mt-m");
    const total=()=>Math.max(0,Math.round((+H.value||0)*60+(+M.value||0)));
    const put=v=>{v=Math.min(v,24*60);H.value=Math.floor(v/60)||"";M.value=v%60||""};
    el.querySelector(".mt-quick").onclick=e=>{const b=e.target.closest("[data-add]");if(b)put(total()+ +b.dataset.add)};
    const apply=mins=>{
      const r=raw(id);
      // a day can't hold more than 24h in all
      const cap=Math.max(0,24*3600-x.tsecs);mins=Math.min(mins*60,cap);
      if(mins>0){r.man=mins;if(!r.status||r.status==="pending"){r.status="progress";delete r.auto}}
      else{delete r.man;if(autoEmpty(id)){delete r.status;delete r.auto}if(!Object.keys(r).length)delete S.entries[id]}
      save();close();refreshCard(id);updateRowHead(id);refreshQuestSoon();refreshHeader();
    };
    el.querySelector("#mt-ok").onclick=()=>{const v=total();apply(v);toast(v?`${fmtDur(v*60)} added by hand · no XP`:"Manual time removed")};
    el.querySelector("#mt-rm")?.addEventListener("click",()=>{const old=x.man;apply(0);toast("Manual time removed",()=>{raw(id).man=old;save();refreshCard(id);refreshHeader()})});
    el.querySelector("#mt-h").addEventListener("keydown",e=>{if(e.key==="Enter")el.querySelector("#mt-ok").click()});
    el.querySelector("#mt-m").addEventListener("keydown",e=>{if(e.key==="Enter")el.querySelector("#mt-ok").click()});
    setTimeout(()=>H.focus(),50);
  });
}
function cycle(id){
  const [y,m,d]=parseId(id),x=day(y,m,d);
  setStatus(id,{pending:"progress",off:"progress",progress:"done",done:"pending"}[x.status]);
}
function setStatus(id,s){
  const [y,m,d]=parseId(id),x=day(y,m,d);
  if(s===x.status||(s==="pending"&&x.status==="off"))return;
  const before=gameStats(),r=raw(id);
  if(s==="pending")delete r.status;else r.status=s;
  delete r.auto;
  save();
  if(U.tab==="log"){renderList();refreshQuest();refreshHeader();const c=document.querySelector(`#d-${id} .chk`);if(c&&s==="done"){c.classList.add("pop");const st=document.querySelector(`#d-${id} .dr-stk`);if(st){st.classList.add("new");st.addEventListener("animationend",()=>st.classList.remove("new"),{once:true})}}}
  reward(id,before);
  if(s==="done")celebrate();
}
// the Work Log header and Days count sit outside the list, so keep them in step when a day changes
function refreshHeader(){
  if(U.tab!=="log")return;const s=monthStats(U.year,U.month),w=s.work?Math.round(Math.min(s.done,s.work)/s.work*100):0;
  const sub=app.querySelector(".mh-sub"),bar=app.querySelector(".mh-bar i"),n=app.querySelector(".view-seg .seg-n");
  if(sub)sub.innerHTML=`<b>${s.done}</b> of ${s.work} work days completed · ${fmtH(s.secs)} tracked`;
  if(bar)bar.style.width=w+"%";if(n)n.textContent=`${s.done}/${s.work}`;
  const rd=app.querySelector(".mh-rider");if(rd&&rd.style.getPropertyValue("--p")!==w+"%"){rd.style.setProperty("--p",w+"%");rd.classList.remove("hop");void rd.offsetWidth;rd.classList.add("hop")}
}
// delete logged work (tasks, notes, status, time, tag) — day-off choices, tags and settings stay; Undo restores it
function wipeLogs(prefix){
  const snap=JSON.parse(JSON.stringify(S.entries)),timer=S.timer;let n=0;
  for(const [id,r] of Object.entries(S.entries)){if(prefix&&!id.startsWith(prefix))continue;
    if(r.tasks||r.notes||r.status||r.secs||r.man||r.tagId||(r.photos&&r.photos.length))n++;
    if(r.off!==undefined)S.entries[id]={off:r.off};else delete S.entries[id]}
  if(S.timer&&(!prefix||S.timer.id.startsWith(prefix)))S.timer=null;
  // days opened with "Fill in" fold back into one "not logged" row once they are empty again
  U.showGaps.clear();U.open=undefined;save();render();
  return {n,undo:()=>{S.entries=snap;S.timer=timer;save();render()}};
}
function deleteLogsSheet(){
  const pre=`${U.year}-${pad(U.month)}-`,has=r=>r.tasks||r.notes||r.status||r.secs||r.man||r.tagId||(r.photos&&r.photos.length);
  const inMonth=Object.entries(S.entries).filter(([id,r])=>id.startsWith(pre)&&has(r)).length,total=Object.values(S.entries).filter(has).length;
  const mName=`${MONTHS[U.month-1]} ${U.year}`;
  sheet(`<div class="stack">
    <div class="row between"><h2>Delete logs</h2><button class="icon-btn" data-close aria-label="Close">${ic.x}</button></div>
    <p class="note" style="margin:0;font-size:13.5px">Removes tasks, notes, statuses, tracked time and tags from the days. Your project tags, days off and settings stay. You can undo right after.</p>
    <button class="btn danger full" id="delMonth" ${inMonth?"":"disabled"}>${ic.trash}Delete ${mName} <span class="num">(${inMonth} day${inMonth===1?"":"s"})</span></button>
    <button class="btn danger full" id="delAll" ${total?"":"disabled"} style="background:color-mix(in srgb,var(--danger) 10%,transparent)">${ic.trash}Delete all logs <span class="num">(${total} day${total===1?"":"s"})</span></button>
    <button class="btn ghost full" data-close>Cancel</button></div>`,(el,close)=>{
    el.querySelector("#delMonth").onclick=()=>{close();const r=wipeLogs(pre);toast(`${mName} cleared — ${r.n} day${r.n===1?"":"s"} deleted`,r.undo)};
    el.querySelector("#delAll").onclick=()=>{close();const r=wipeLogs("");toast(`All logs deleted — ${r.n} day${r.n===1?"":"s"}`,r.undo)};
